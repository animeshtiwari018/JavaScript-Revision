<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Background Color Chsnger</h2>
    <button id="start">Start</button>
    <button id="stop">Stop</button>

    <script>
      // ****Generate random color****
      let randomColor = function () {
        const hex = "0123456789ABCDEF";
        let color = "#";
        for (let i = 0; i < 6; i++) {
          color += hex[Math.floor(Math.random() * 16)];
        }
        return color;
      };

      //   ***Variable to store Set and clear interval
      let intervalId;

      //   ***Function to change color****
      const startChange = function () {
        document.body.style.backgroundColor = randomColor();
        if (!intervalId) {
          intervalId = setInterval(startChange, 2000);
        }
      };

      // ****function to stop change****
      const stopChange = function () {
        clearInterval(intervalId);
        intervalId = null;
      };

      //   ***querySelector for choosing button****
      let startBtn = document.querySelector("#start");
      let stopBtn = document.querySelector("#stop");

      // ****click eventListener****
      startBtn.addEventListener("click", startChange);
      stopBtn.addEventListener("click", stopChange);
    </script>
  </body>
</html>
