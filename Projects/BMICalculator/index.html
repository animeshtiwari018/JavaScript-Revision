<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="canvas">
      <h1>BMI Calculator</h1>
      <form>
        <p>
          <label>Height in CM: </label
          ><input type="text" placeholder="Enter your Height" id="height" />
        </p>
        <p>
          <label>Weight in KG: </label
          ><input type="text" placeholder="Enter your Weight" id="height" />
        </p>
        <button class="cal-button">Calculate</button>

        <div class="weight_guide">
          <h3>BMI Weight guide</h3>
          <p>Under weight: Less than 18.6 KG</p>
          <p>Over weight: Greater than 24.9 KG</p>
          <p>Normal weight: 18.6 to 24.9 KG</p>
        </div>
      </form>
    </div>
    <script src="script.css"></script>
  </body>
</html>
